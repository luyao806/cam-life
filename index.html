<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#087CC1"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <meta
      name="description"
      content="柬生活 CAM LIFE，柬埔寨一站式本地生活服务平台。"
    />

    <meta
      name="application-name"
      content="柬生活 CAM LIFE"
    />

    <title>柬生活 CAM LIFE</title>

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- 提前建立 Telegram 网络连接 -->
    <link
      rel="preconnect"
      href="https://telegram.org"
    />

    <link
      rel="dns-prefetch"
      href="https://telegram.org"
    />

    <!-- 优先加载压缩后的启动封面 -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/splash.webp"
      fetchpriority="high"
    />

    <!-- React 初始化前的启动画面 -->
    <style>
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #064D38;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #root:empty {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #064D38;
        background-image:
          url('/src/assets/splash.webp');
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }
    </style>

    <!-- Telegram Mini App 官方 SDK -->
    <script
      defer
      src="https://telegram.org/js/telegram-web-app.js"
    ></script>

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
